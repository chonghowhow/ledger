<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小帳本">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F1E9" id="metaTheme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<title>小帳本</title>
<style>
:root{
  --bg:#F6F1E9; --card:#FFFDF9; --ink:#1F1B16; --ink2:#6B635A; --ink3:#A39A8F;
  --line:#E8E0D4; --exp:#D9583B; --inc:#2F8F5B; --chip:#EFE8DC;
  --solid:#1F1B16; --onSolid:#fff; --hero:#1F1B16; --fab:#D9583B;
  --r:20px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#121110; --card:#1C1A17; --ink:#F2ECE3; --ink2:#B9B0A4; --ink3:#7F776D;
  --line:#2D2924; --exp:#F07A5C; --inc:#52C08A; --chip:#2A2622;
  --solid:#F2ECE3; --onSolid:#1C1A17;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:contain;transition:background .2s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.num{font-family:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.app{max-width:520px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 110px)}
.hide{display:none!important}

/* header */
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.brand{font-weight:900;font-size:20px;letter-spacing:.04em;margin-right:auto}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--ink3);letter-spacing:.12em;white-space:nowrap}
.sbtn{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);flex:none}
.sbtn svg{width:19px;height:19px}
.month{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.month .ar{width:30px;height:32px;border-radius:50%;font-size:18px;color:var(--ink2)}
.month .ar:active,.sbtn:active{background:var(--chip)}
.mlab{height:32px;border-radius:999px;min-width:96px;padding:0 6px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.mlab .car{font-size:9px;color:var(--ink3)}

/* summary */
.sum{background:var(--hero);color:#FBF6EE;border-radius:26px;padding:20px 20px 18px;position:relative;overflow:hidden;transition:background .3s}
.sum::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#ffffff18,transparent 70%)}
.sum .lbl{font-size:12px;color:#ffffffb0;letter-spacing:.1em}
.sum .big{font-size:38px;font-weight:500;margin:4px 0 14px;line-height:1.1}
.sum .big .cur{font-size:16px;margin-right:4px;color:#ffffffb0}
.sum .row{display:flex;gap:10px}
.sum .row>div{flex:1;background:#ffffff14;border-radius:14px;padding:10px 12px}
.sum .row b{display:block;font-size:16px;font-weight:500;margin-top:2px}
.bud{margin-top:14px;font-size:12px;color:#ffffffb0}
.bud .bar{height:6px;background:#ffffff22;border-radius:6px;margin-top:6px;overflow:hidden}
.bud .bar i{display:block;height:100%;background:#F2C14E;border-radius:6px;transition:width .4s}
.bud.over .bar i{background:#FF8A6B}
.bud .t{display:flex;justify-content:space-between}
.banner{margin:12px 0 0;padding:10px 14px;border-radius:14px;background:#FCEFD6;color:#7A5212;font-size:13px;display:none}
[data-theme=dark] .banner{background:#3A2E14;color:#F2D28A}
.banner.show{display:block}

/* list */
.sec{margin-top:22px}
.day{margin-bottom:14px}
.dayh{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);padding:0 6px 6px;letter-spacing:.04em}
.dayc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item:active{background:var(--chip)}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--cbg,var(--chip))}
[data-theme=dark] .ico{background:color-mix(in srgb,var(--cbg,#888) 20%,var(--card))}
.item .mid{flex:1;min-width:0}
.item .c{font-weight:500;font-size:15px;display:flex;align-items:center;gap:6px}
.item .n{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-size:16px;font-weight:500;white-space:nowrap}
.tag{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--ink2);font-weight:400}
.exp{color:var(--exp)} .inc{color:var(--inc)}
.empty{text-align:center;color:var(--ink3);padding:50px 20px;font-size:14px;line-height:1.8}
.empty .e{font-size:44px;display:block;margin-bottom:6px}
.daychip{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:12px;font-size:13px;color:var(--ink2)}
.daychip button{padding:6px 12px;border-radius:10px;background:var(--chip);font-size:13px;color:var(--ink)}

/* cards & settings */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;color:var(--ink2);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0000001a}
.donut{display:flex;align-items:center;gap:16px}
.donut svg{flex:none}
.legend{flex:1;min-width:0}
.crow{display:flex;align-items:center;gap:10px;padding:8px 0}
.crow+.crow{border-top:1px dashed var(--line)}
.crow .ico{width:32px;height:32px;font-size:16px;border-radius:10px}
.crow .mid{flex:1;min-width:0}
.crow .top2{display:flex;justify-content:space-between;font-size:14px}
.crow .pb{height:5px;border-radius:5px;background:var(--chip);margin-top:5px;overflow:hidden}
.crow .pb i{display:block;height:100%;border-radius:5px}
.crow .pct{font-size:11px;color:var(--ink3)}
.set .rowi{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;width:100%;text-align:left}
.set .rowi+.rowi{border-top:1px solid var(--line)}
.set .rowi:first-child{padding-top:0}.set .rowi:last-child{padding-bottom:0}
.set label,.set .lb{font-size:14px}
.hint{font-size:12px;color:var(--ink3);margin-top:2px}
.set input[type=number]{width:120px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:right}
.chev{color:var(--ink3);font-size:13px;white-space:nowrap}
.btn{padding:10px 16px;border-radius:12px;background:var(--chip);font-size:14px;font-weight:500;white-space:nowrap}
.btn.dark{background:var(--solid);color:var(--onSolid)}
.btn.danger{background:#F9E1DA;color:#A83A20}
[data-theme=dark] .btn.danger{background:#3A1F19;color:#F59A82}
.btn.danger.arm,.btn.arm{background:#C2412A!important;color:#fff!important}
.btn.wide{width:100%;padding:13px;border-radius:14px;font-size:15px}
textarea.csv{width:100%;height:120px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--ink2);white-space:nowrap;flex:none}
.swatches{display:flex;gap:10px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 16px calc(var(--safe-b) + 12px);pointer-events:none}
.nav .in{max-width:488px;margin:0 auto;background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;display:flex;align-items:center;padding:6px;pointer-events:auto;box-shadow:0 8px 30px #3a2c1a1a}
.nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);padding:6px 0;border-radius:16px}
.nav .tab svg{width:22px;height:22px}
.nav .tab.on{color:var(--ink)}
.fab{width:58px;height:58px;border-radius:20px;background:var(--fab);color:#fff;display:grid;place-items:center;margin:0 8px;box-shadow:0 6px 18px #0000002e;transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px}

/* sheets */
.mask{position:fixed;inset:0;touch-action:none;background:#0d0b0966;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:42;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.sheet.show{transform:none}
#sheet{z-index:44}
.sheet .in{max-width:520px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 16px calc(var(--safe-b) + 14px);max-height:92vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#panel .in{height:88vh;display:flex;flex-direction:column}
#pBody{flex:1;overflow-y:auto;overscroll-behavior:contain;margin:0 -16px;padding:0 16px 10px}
.sh-top,.grab,.cal-h{touch-action:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.sh-top b{font-size:17px}
.x{width:34px;height:34px;border-radius:50%;background:var(--chip);font-size:16px;color:var(--ink2);flex:none}
.back{font-size:14px;color:var(--ink2);padding:6px 10px 6px 0}
.amt{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;padding:8px 4px 6px;border-bottom:2px solid var(--line);min-height:64px}
.amt .cur{font-size:16px;color:var(--ink3)}
.amt .v{font-size:40px;font-weight:500;word-break:break-all;text-align:right}
.amt .eq{font-size:14px;color:var(--ink3);margin-right:auto}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
.cat{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink2);padding:6px 0;border-radius:14px;min-width:0}
.cat span.nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .ico{width:38px;height:38px;font-size:19px;border-radius:12px;transition:transform .15s}
.cat.on{color:var(--ink);font-weight:700}
.cat.on .ico{outline:2px solid var(--ink);outline-offset:2px;transform:scale(1.05)}
.meta{display:flex;gap:8px;margin-bottom:10px}
.fld{width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.meta .fld{flex:1;min-width:0}
.meta input[type=date]{flex:none;width:142px}
.qn{display:flex;gap:6px;overflow-x:auto;margin:-2px -16px 10px;padding:0 16px;scrollbar-width:none}
.qn::-webkit-scrollbar{display:none}
.qn button{flex:none;padding:7px 12px;border-radius:999px;background:var(--chip);font-size:13px;color:var(--ink);white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
.qn button:active{background:var(--line)}
.qn button.cur{outline:1.5px solid var(--ink)}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.k{height:52px;border-radius:15px;background:var(--bg);font-size:22px;font-family:ui-monospace,Menlo,monospace;font-weight:500}
.k:active{background:var(--chip)}
.k.op{color:var(--ink2);background:var(--chip)}
.k.fn{color:var(--ink2);background:var(--chip);font-size:19px}
.k.eq{color:var(--ink);background:var(--chip);font-weight:700}
.k.ok{color:#fff;font-family:inherit;font-size:16px;font-weight:700;grid-row:span 2;height:auto;background:var(--exp)}
.k.ok.inc{background:var(--inc)}
.delrow{margin-top:10px;text-align:center}
.delrow button{font-size:13px;color:var(--exp);padding:8px 14px;border-radius:12px}
.delrow button.arm{background:#C2412A;color:#fff}
.flab{font-size:12px;color:var(--ink3);margin:14px 2px 6px;display:block}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.cal-h .nb{width:40px;height:40px;border-radius:50%;background:var(--chip);font-size:20px;color:var(--ink2)}
.cal-h .tt{font-weight:900;font-size:18px;padding:8px 14px;border-radius:14px;display:inline-flex;align-items:center;gap:6px}
.cal-h .tt .car{font-size:11px;color:var(--ink3)}
.cal-sum{text-align:center;font-size:12px;color:var(--ink3);margin-bottom:10px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-w{text-align:center;font-size:11px;color:var(--ink3);padding:4px 0}
.cd{height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:2px;font-size:15px;font-weight:500}
.cd:active{background:var(--chip)}
.cd small{font-size:10px;font-family:ui-monospace,Menlo,monospace;letter-spacing:-.03em;line-height:1}
.cd small.e{color:var(--exp)} .cd small.i{color:var(--inc)}
.cd.out{visibility:hidden}
.cd.sun{color:var(--exp)}
.cd.today{background:var(--chip)}
.cd.sel{background:var(--solid);color:var(--onSolid)}
.cd.sel small{color:var(--onSolid)!important;opacity:.85}
.cal-mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cm{height:64px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:700}
.cm small{font-size:11px;font-weight:400;color:var(--exp);font-family:ui-monospace,Menlo,monospace}
.cm small.z{color:var(--ink3)}
.cm.cur{outline:2px solid var(--ink);outline-offset:-2px}
.cm.now{background:var(--chip)}
.cal-f{display:flex;gap:8px;margin-top:14px}
.cal-f .btn{flex:1;padding:13px;border-radius:14px;font-size:15px}

/* panel lists */
.plist{background:var(--bg);border-radius:18px;overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px}
.prow+.prow{border-top:1px solid var(--line)}
.prow .mid{flex:1;min-width:0;text-align:left}
.prow .mid b{font-weight:500;font-size:15px;display:block}
.prow .mv{width:34px;height:34px;border-radius:10px;background:var(--card);color:var(--ink2);font-size:14px}
.prow .mv:disabled{opacity:.3}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emo button{height:40px;border-radius:10px;font-size:21px}
.emo button:active,.emo button.on{background:var(--chip)}
.big-emo{width:64px;height:64px;font-size:32px;border-radius:20px;margin:0 auto 8px}
.srch{position:relative;margin-bottom:10px}
.srch input{padding-left:38px}
.srch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink3)}
.sres-sum{font-size:12px;color:var(--ink3);margin:2px 4px 8px}

.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 100px);transform:translate(-50%,160px);background:var(--solid);color:var(--onSolid);padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;transition:transform .3s;max-width:92vw;text-align:center;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}

/* ================= 像素風格 ================= */
@font-face{font-family:"Cubic11";src:url("cubic11.woff2") format("woff2");font-display:swap}
:root[data-style=pixel]{
  --bg:#EFE6CF; --card:#FFF8E7; --ink:#2B2118; --ink2:#5E5040; --ink3:#8F8068;
  --line:#2B2118; --chip:#E6D9B8; --exp:#D24A3A; --inc:#3C8C40;
  --solid:#2B2118; --onSolid:#FFF8E7; --bd:#2B2118; --sh:#2B2118; --dot:#E6DCC0;
}
:root[data-style=pixel][data-theme=dark]{
  --bg:#1B1726; --card:#2C2640; --ink:#F3E9D2; --ink2:#C9BCA0; --ink3:#8F84A6;
  --line:#0E0B16; --chip:#3A3352; --exp:#F0715E; --inc:#6CC46F;
  --solid:#F3E9D2; --onSolid:#2C2640; --bd:#0E0B16; --sh:#0E0B16; --dot:#211C2F;
}
[data-style=pixel] *{border-radius:0!important}
[data-style=pixel] body{background-color:var(--bg);background-image:repeating-conic-gradient(var(--dot) 0 25%,transparent 0 50%);background-size:8px 8px;image-rendering:pixelated}
[data-style=pixel] body,[data-style=pixel] button,[data-style=pixel] input,[data-style=pixel] select,[data-style=pixel] textarea,[data-style=pixel] .num{font-family:"Cubic11",ui-monospace,monospace;letter-spacing:0;-webkit-font-smoothing:none;font-weight:400!important}
[data-style=pixel] b,[data-style=pixel] .brand,[data-style=pixel] .mlab{font-weight:400}
[data-style=pixel] svg{shape-rendering:crispEdges}
[data-style=pixel] .pxe{width:32px;height:32px;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
[data-style=pixel] .big-emo .pxe{width:48px;height:48px}

/* 方框＋硬陰影 */
[data-style=pixel] .card,[data-style=pixel] .dayc,[data-style=pixel] .daychip,[data-style=pixel] .month,[data-style=pixel] .sbtn,
[data-style=pixel] .nav .in,[data-style=pixel] .btn,[data-style=pixel] .fld,[data-style=pixel] .set input[type=number],
[data-style=pixel] .plist,[data-style=pixel] textarea.csv,[data-style=pixel] .banner{border:3px solid var(--bd);box-shadow:4px 4px 0 var(--sh)}
[data-style=pixel] .fld,[data-style=pixel] .set input[type=number],[data-style=pixel] textarea.csv{box-shadow:inset 3px 3px 0 var(--chip)}
[data-style=pixel] .btn:active,[data-style=pixel] .sbtn:active,[data-style=pixel] .k:active,[data-style=pixel] .fab:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)!important}

/* header */
[data-style=pixel] .brand{font-size:24px;letter-spacing:2px}
[data-style=pixel] .brand small{font-size:12px;letter-spacing:2px;margin-top:2px}
[data-style=pixel] .sbtn{width:40px;height:40px;background:var(--card)}
[data-style=pixel] .month{padding:2px}
[data-style=pixel] .mlab{font-size:16px}
[data-style=pixel] .month .ar{font-size:16px;width:28px}

/* summary */
[data-style=pixel] .sum{border:3px solid var(--bd);box-shadow:6px 6px 0 var(--sh);padding:16px 16px 14px}
[data-style=pixel] .sum::after{display:none}
[data-style=pixel] .sum::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff0d 0 4px,transparent 4px 8px);pointer-events:none}
[data-style=pixel] .sum .lbl{font-size:12px;letter-spacing:2px}
[data-style=pixel] .sum .big{font-size:40px;margin:8px 0 12px}
[data-style=pixel] .sum .big .cur{font-size:16px}
[data-style=pixel] .sum .row>div{background:#00000026;border:2px solid #00000040}
[data-style=pixel] .sum .row b{font-size:20px}
[data-style=pixel] .bud{font-size:12px}
[data-style=pixel] .bud .bar{height:16px;background:#00000040;border:2px solid #00000059;padding:2px}
[data-style=pixel] .bud .bar i{background:repeating-linear-gradient(90deg,#F2C14E 0 8px,transparent 8px 10px)}
[data-style=pixel] .bud.over .bar i{background:repeating-linear-gradient(90deg,#FF8A6B 0 8px,transparent 8px 10px)}

/* list */
[data-style=pixel] .dayh{font-size:12px;color:var(--ink2)}

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const DEF_CATS = {
  expense:[["food","餐飲","🍜"],["traffic","交通","🚇"],["shop","購物","🛍️"],["daily","日用","🧴"],["fun","娛樂","🎮"],["home","居家","🏠"],["med","醫療","💊"],["edu","教育","📚"],["phone","通訊","📱"],["trip","旅遊","✈️"],["gift","人情","🎁"],["other","其他","📦"]],
  income:[["salary","薪資","💼"],["bonus","獎金","🧧"],["invest","投資","📈"],["part","兼職","💻"],["refund","退款","↩️"],["iother","其他","✨"]]
};
const BG = ["#FCE3D3","#DCE9F7","#F7DDEA","#E3F0DF","#E9E1F7","#F6ECCF","#DDF1EE","#E2E6F7","#E6EEF0","#D9EEF7","#F9E0DC","#ECE6DC"];
const BG_I = ["#DDEFE3","#FBE0DA","#E0ECF8","#ECE4F7","#F3EBD6","#ECE6DC"];
const CHART = ["#D9583B","#3E7CB1","#C95F99","#5E9E52","#8064C2","#D4A72C","#3BA39A","#5867B8","#7F9AA4","#2B9CC9","#E07B6A","#A3968A"];
const CHART_I = ["#2F8F5B","#E06A50","#3E7CB1","#8064C2","#C9A23A","#A3968A"];
const EMOJIS = "🍜🍱🍔☕🧋🍺🍰🛒🚇🚌🚕⛽🅿️🛵🏠💡💧🔥📱💻🎮🎬🎵🎤📚✏️💊🏥🐶🐱👶💇👕👟💄💍🎁✈️🏨🏖️💼🧧📈💰🏦💳🧾🔁📦✨❤️⚽🏋️".match(/\p{Extended_Pictographic}️?/gu);
const THEMES = {
  ink:   {name:"墨黑",hero:"#1F1B16",heroD:"#2B2621",fab:"#D9583B"},
  coral: {name:"珊瑚",hero:"#C8553D",heroD:"#8F3A28",fab:"#C8553D"},
  forest:{name:"森林",hero:"#2F6B4F",heroD:"#244F3B",fab:"#2F8F5B"},
  ocean: {name:"海洋",hero:"#2B5C8A",heroD:"#1F4466",fab:"#2F74B5"},
  grape: {name:"葡萄",hero:"#5B4A8B",heroD:"#433668",fab:"#7A5FC0"}
};
const WEEK = ["日","一","二","三","四","五","六"];
const APP_VERSION = "2026.11.14";

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const mKey = (y,m)=> y+"-"+pad(m+1);
const addM = (ym,n)=>{ const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+n,1); return mKey(d.getFullYear(),d.getMonth()); };
const fmt = n => { const r=Math.round(n*100)/100; return r===Math.round(r) ? Math.round(r).toLocaleString("zh-TW") : r.toLocaleString("zh-TW",{minimumFractionDigits:2,maximumFractionDigits:2}); };
const short = n => n>=10000 ? (n/10000).toFixed(n>=100000?0:1).replace(/\.0$/,"")+"萬" : String(Math.round(n));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- state ---------- */
let records = [];
let settings = {budget:0,cats:null,recurring:[]};
let view = "list", stType = "expense";
const now = new Date();
let curY = now.getFullYear(), curM = now.getMonth();
let selDay = null;

/* ---------- categories ---------- */
function catLists(){ return settings.cats || {expense:DEF_CATS.expense.map(c=>({id:c[0],name:c[1],emoji:c[2]})),income:DEF_CATS.income.map(c=>({id:c[0],name:c[1],emoji:c[2]}))}; }
function visCats(type){ return catLists()[type].filter(c=>!c.hidden); }
let catMap = {};
function buildCatMap(){
  catMap = {};
  const L = catLists();
  ["expense","income"].forEach(t=>L[t].forEach((c,i)=>{
    catMap[c.id]={...c,type:t,bg:(t==="expense"?BG:BG_I)[i%(t==="expense"?BG:BG_I).length],color:(t==="expense"?CHART:CHART_I)[i%(t==="expense"?CHART:CHART_I).length]};
  }));
}
function catOf(id,type){ return catMap[id] || {id,name:"未分類",emoji:"❔",bg:"#ECE6DC",color:"#A3968A",type}; }
/* 像素風：把 emoji 畫到 16×16 小畫布再放大，變成像素圖示 */
const isPixel = () => document.documentElement.dataset.style==="pixel";
const pxCache = {};
function pxEmoji(e){
  if(pxCache[e]) return pxCache[e];
  try{
    const N=16, c=document.createElement("canvas"); c.width=c.height=N;
    const x=c.getContext("2d");
    x.textAlign="center"; x.textBaseline="middle";

let recRunning=false;
function recDate(rule,ym){ const [y,m]=ym.split("-").map(Number); return ym+"-"+pad(Math.min(rule.day,new Date(y,m,0).getDate())); }
function nextRun(rule){
  let ym = rule.lastRun ? addM(rule.lastRun,1) : rule.start;
  return recDate(rule,ym);
}
async function runRecurring(){
  if(recRunning || store.mode==="loading" || store.readOnly || !settings.recurring.length) return;
  recRunning=true; let n=0, changed=false;
  try{
    const t=new Date(), today=ymd(t), curYM=mKey(t.getFullYear(),t.getMonth());
    const have=new Set(records.map(r=>r.id));
    for(const rule of settings.recurring){
      if(rule.paused) continue;
      let ym = rule.lastRun ? addM(rule.lastRun,1) : rule.start, guard=0;
      while(ym<=curYM && guard++<60){
        const date=recDate(rule,ym);
        if(date>today) break;
        const id="rc-"+rule.id+"-"+ym.replace("-","");
        if(!have.has(id)){ await store.save({id,type:rule.type,amount:rule.amount,cat:rule.cat,date,note:rule.note||"",ts:Date.now(),rec:rule.id}); have.add(id); n++; }
        rule.lastRun=ym; changed=true; ym=addM(ym,1);
      }
    }
    if(changed) await store.saveSettings();
  }catch(e){ writeErr(e); }
  finally{ recRunning=false; }
  if(n){ toast("🔁 已自動記入 "+n+" 筆固定收支"); renderAll(); refreshPanel(); }
}

/* 像素圓餅圖：48×48 逐點上色後放大 3 倍 */
function pxDonut(arr,total){
  try{
    const N=48, c=document.createElement("canvas"); c.width=c.height=N;
    const x=c.getContext("2d"), d=x.createImageData(N,N), a=d.data;
    const cs=getComputedStyle(document.documentElement);
    const hex=h=>{ h=h.trim().replace("#",""); if(h.length===3) h=h.split("").map(ch=>ch+ch).join(""); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; };
    const bd=hex(cs.getPropertyValue("--bd")||"#2B2118");
    const stops=[]; let acc=0; arr.forEach(o=>{ acc+=o.v/total; stops.push([acc,hex(o.c.color)]); });
    const cx=N/2-.5, cy=N/2-.5, R=23, r=13;
    for(let y=0;y<N;y++) for(let xx=0;xx<N;xx++){
      const dx=xx-cx, dy=yy(y)-cy, dist=Math.round(Math.sqrt(dx*dx+dy*dy)); let col=null;
      if(dist===R||dist===r) col=bd;
      else if(dist<R && dist>r){
        let ang=Math.atan2(dx,-dy)/(2*Math.PI); if(ang<0) ang+=1;
        col=(stops.find(st=>ang<=st[0])||stops[stops.length-1])[1];
      }
      if(col){ const i=(y*N+xx)*4; a[i]=col[0]; a[i+1]=col[1]; a[i+2]=col[2]; a[i+3]=255; }
    }
    x.putImageData(d,0,0); return c.toDataURL();
  }catch(e){ return ""; }
  function yy(v){ return v; }
}

    let h;

    el.innerHTML=h+'</div>';
  }
  const months=[]; for(let i=5;i>=0;i--){ const d=new Date(curY,curM-i,1); const t=totals(monthRecs(d.getFullYear(),d.getMonth())); months.push({m:d.getMonth()+1,e:t.e,i:t.i,cur:i===0}); }

  $("trend").innerHTML=s+note;
}

/* 計算機：支援 + − × ÷，先乘除後加減 */
const OPS=/[+\-*/]/;
function evalExpr(s){
  const t=(s||"").match(/\d+\.?\d*|\.\d+|[+\-*/]/g)||[];
  while(t.length && OPS.test(t[t.length-1])) t.pop();
  if(!t.length) return 0;
  const terms=[parseFloat(t[0])], ops=[];
  for(let i=1;i<t.length;i+=2){
    const op=t[i], v=parseFloat(t[i+1]);
    if(op==="*") terms[terms.length-1]*=v;
    else if(op==="/") terms[terms.length-1] = v===0 ? NaN : terms[terms.length-1]/v;
    else { ops.push(op); terms.push(v); }
  }
  let r=terms[0];
  ops.forEach((op,j)=>{ r = op==="+" ? r+terms[j+1] : r-terms[j+1]; });
  return r;
}
const showExpr = s => s.replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−");
function paintAmt(){
  const s=ed.expr;
  $("amtV").textContent = s ? showExpr(s) : "0";
  $("amtV").className="v num "+(s?(ed.type==="income"?"inc":"exp"):"");
  let eq="";
  if(OPS.test(s)){ const v=evalExpr(s); eq = isNaN(v) ? "= 無法除以 0" : "= "+(v<0?"−":"")+fmt(Math.abs(Math.round(v*100)/100)); }
  $("amtEq").textContent = eq;
}
const KEYS=["7","8","9","÷","⌫","4","5","6","×","C","1","2","3","−","OK",".","0","=","+"];
function paintKeys(){
  $("keys").innerHTML=KEYS.map(k=>{
    if(k==="OK") return '<button class="k ok '+(ed.type==="income"?"inc":"")+'" data-k="OK">'+(ed.id?"更新":"完成")+'</button>';
    const cls = ["÷","×","−","+"].includes(k) ? " op" : (k==="⌫"||k==="C") ? " fn" : k==="=" ? " eq" : "";
    return '<button class="k'+cls+'" data-k="'+k+'">'+(k==="⌫"?G("bs"):k)+'</button>';
  }).join("");
}
function press(k){
  let s=ed.expr;
  const last=s.slice(-1), curNum=s.split(OPS).pop();
  const OPMAP={"+":"+","−":"-","×":"*","÷":"/"};
  if(k==="⌫"){ s=s.slice(0,-1); }
  else if(k==="C"){ s=""; }
  else if(OPMAP[k]){ const op=OPMAP[k]; if(!s) return; if(OPS.test(last)||last===".") s=s.slice(0,-1)+op; else s+=op; }
  else if(k==="="){
    if(!OPS.test(s)) return;
    const v=evalExpr(s);
    if(isNaN(v)){ toast("無法除以 0"); return; }
    if(v<0){ toast("金額不能小於 0"); return; }
    s=String(Math.round(v*100)/100);
  }
  else if(k==="."){ if(curNum.includes(".")) return; s+=(curNum===""?"0.":"."); }
  else if(k==="OK"){ save(); return; }
  else {
    if(curNum.includes(".") && curNum.split(".")[1].length>=2) return;
    if(curNum.replace(".","").length>=9) return;
    if(curNum==="0") s=s.slice(0,-1);
    s+=k;
  }
  ed.expr=s; paintAmt();
}

let saving=false;
async function save(){
  if(saving) return;
  const raw=evalExpr(ed.expr);
  if(isNaN(raw)){ toast("無法除以 0"); return; }
  const amount=Math.round(raw*100)/100;
  if(!(amount>0)){ toast(raw<0?"金額不能小於 0":"請輸入金額"); return; }
  const date=$("dateIn").value; if(!date){ toast("請選擇日期"); return; }
  const rec={id:ed.id||uid("r"),type:ed.type,amount,cat:ed.cat,date,note:$("noteIn").value.trim(),ts:ed.ts||Date.now()};
  if(ed.rec) rec.rec=ed.rec;
  const isNew=!ed.id, fromPanel=$("panel").classList.contains("show");
  saving=true;
  try{
    await store.save(rec);
    closeSheet();
    if(!fromPanel){
      if(selDay && selDay!==date) selDay=date;
      const [y,m]=date.split("-").map(Number);
      if(y!==curY||m-1!==curM){ curY=y; curM=m-1; }
    }
    renderAll();
    toast((isNew?"已記下 ":"已更新 ")+catOf(rec.cat,rec.type).emoji+" "+fmt(amount));
  }catch(e){ writeErr(e); }
  finally{ saving=false; }
}

  const ed_=t.closest("[data-edit]"); if(ed_){ st.edit=ed_.dataset.edit; st.emoji=null; renderCatsPanel(); return; }
  if(t.closest("#pcAdd")){ st.edit="new"; st.emoji=null; renderCatsPanel(); return; }
  const em=t.closest(".emo button"); if(em){ st.emoji=em.dataset.e; $("pcEmoji").value=st.emoji; $("pcPrev").innerHTML=emoHtml(st.emoji); [...em.parentNode.children].forEach(x=>x.classList.toggle("on",x===em)); return; }
  const up=t.closest("[data-up]"), dn=t.closest("[data-dn]");
  if(up||dn){
    const cats=ensureCats()[st.type], id=(up||dn).dataset[up?"up":"dn"];
    const vis=cats.filter(c=>!c.hidden), vi=vis.findIndex(c=>c.id===id), other=vis[vi+(up?-1:1)];
    if(!other) return;
    const a=cats.findIndex(c=>c.id===id), b=cats.findIndex(c=>c.id===other.id);
    [cats[a],cats[b]]=[cats[b],cats[a]];
    renderCatsPanel(); try{ await store.saveSettings(); }catch(err){ writeErr(err); } return;
  }
  if(t.closest("#pcSave")){
    const name=(st.name||"").trim(), emoji=(st.emoji||"").trim()||"🏷️";
    if(!name){ toast("請輸入分類名稱"); return; }
    const cats=ensureCats()[st.type];
    if(cats.some(c=>!c.hidden && c.name===name && c.id!==st.edit)){ toast("已經有同名的分類"); return; }
    if(st.edit==="new") cats.push({id:uid("c"),name,emoji});
    else { const c=cats.find(x=>x.id===st.edit); c.name=name; c.emoji=emoji; }
    st.edit=null; st.emoji=null;
    try{ await store.saveSettings(); }catch(err){ writeErr(err); }
    renderCatsPanel(); renderAll(); toast("分類已儲存"); return;
  }
  if(t.closest("#pcDel")){
    const b=$("pcDel");
    if(visCats(st.type).length<=1){ toast("至少要保留一個分類"); return; }
    if(!b.dataset.armed){ arm(b,"再按一次確認刪除"); return; }
    const c=ensureCats()[st.type].find(x=>x.id===st.edit); if(c) c.hidden=true;
    st.edit=null; st.emoji=null;
    try{ await store.saveSettings(); }catch(err){ writeErr(err); }
    renderCatsPanel(); renderAll(); toast("分類已刪除"); return;
  }
  if(t.closest("#pcReset")){
    const b=$("pcReset");
    if(!b.dataset.armed){ arm(b,"再按一次恢復預設"); return; }
    const L=ensureCats();
    ["expense","income"].forEach(ty=>{
      const def=DEF_CATS[ty].map(c=>({id:c[0],name:c[1],emoji:c[2]}));
      const defIds=new Set(def.map(c=>c.id));
      const custom=L[ty].filter(c=>!defIds.has(c.id)).map(c=>({...c,hidden:true}));
      L[ty]=def.concat(custom);
    });
    try{ await store.saveSettings(); }catch(err){ writeErr(err); }
    renderCatsPanel(); renderAll(); toast("已恢復預設分類"); return;
  }
}
$("openCats").onclick=()=>openPanel("cats");

/* recurring */
function renderRecPanel(){
  const st=pState;
  if(st.edit) return renderRecEdit();
  $("pTitle").textContent="固定收支";
  const L=settings.recurring;
  let h='<div class="hint" style="margin:0 4px 12px;line-height:1.6">每月到了設定的日子，打開 App 時會自動幫你記一筆。小月沒有的日期（例如 31 日）會記在月底。</div>';
  if(!L.length) h+='<div class="empty" style="padding:30px 10px"><span class="e">'+emoHtml("🔁")+'</span>還沒有固定收支<br>例如房租、Netflix、薪水</div>';
  else{
    h+='<div class="plist">';
    L.forEach(r=>{
      const c=catOf(r.cat,r.type), nx=nextRun(r), d=new Date(nx+"T00:00:00");
      h+='<button class="prow" style="width:100%" data-rid="'+esc(r.id)+'">'+icoHtml(c)+'<span class="mid"><b>'+esc(r.note||c.name)+'</b><span class="hint">每月 '+r.day+' 日 · 下次 '+(d.getMonth()+1)+'/'+d.getDate()+'</span></span><span class="num '+(r.type==="income"?"inc":"exp")+'" style="font-weight:500">'+(r.type==="income"?"+":"−")+fmt(r.amount)+'</span></button>';
    });
    h+='</div>';
  }
  h+='<button class="btn dark wide" style="margin-top:14px" id="prAdd">＋ 新增固定收支</button>';
  $("pBody").innerHTML=h;
}
function renderRecEdit(){
  const st=pState, isNew=st.edit==="new";
  if(!st.f){
    const t=new Date();
    const r=isNew?null:settings.recurring.find(x=>x.id===st.edit);
    if(!isNew && !r){ st.edit=null; return renderRecPanel(); }
    st.f = r ? clone(r) : {type:"expense",amount:"",cat:(visCats("expense")[0]||{}).id,day:t.getDate(),note:"",start:mKey(t.getFullYear(),t.getMonth())};
  }
  const f=st.f;
  $("pTitle").innerHTML='<button class="back" id="prBack">'+G("l")+' 返回</button>'+(isNew?"新增固定收支":"編輯固定收支");
  let h='<div style="text-align:center"><span class="seg" id="prSeg"><button data-t="expense" class="'+(f.type==="expense"?"on":"")+'">支出</button><button data-t="income" class="'+(f.type==="income"?"on":"")+'">收入</button></span></div>';
  h+='<span class="flab">名稱</span><input class="fld" id="prNote" maxlength="30" placeholder="例如：房租、Netflix" value="'+esc(f.note)+'">';
  h+='<span class="flab">金額</span><input class="fld num" id="prAmt" type="number" inputmode="decimal" min="0" placeholder="0" value="'+esc(f.amount)+'">';
  h+='<span class="flab">分類</span><div class="cats" id="prCats" style="margin-top:0">'+catGrid(f.type,f.cat)+'</div>';
  h+='<div style="display:flex;gap:10px"><div style="flex:1"><span class="flab">每月幾號</span><select class="fld" id="prDay">';
  for(let d=1;d<=31;d++) h+='<option value="'+d+'"'+(d===+f.day?" selected":"")+'>'+d+' 日</option>';
  h+='</select></div><div style="flex:1"><span class="flab">從哪個月開始</span><input class="fld" type="month" id="prStart" value="'+esc(f.start)+'"'+(isNew?"":" disabled")+'></div></div>';
  if(!isNew) h+='<div class="hint" style="margin-top:6px">修改只會影響之後的紀錄，已記入的不會變。</div>';
  h+='<button class="btn dark wide" style="margin-top:16px" id="prSave">儲存</button>';
  if(!isNew) h+='<button class="btn danger wide" style="margin-top:8px" id="prDel">停止並刪除這個固定收支</button><div class="hint" style="text-align:center;margin-top:6px">已經記入的紀錄會保留</div>';
  $("pBody").innerHTML=h;
}
async function recAction(e){
  const st=pState, t=e.target;
  const row=t.closest("[data-rid]"); if(row){ st.edit=row.dataset.rid; st.f=null; renderRecPanel(); return; }
  if(t.closest("#prAdd")){ st.edit="new"; st.f=null; renderRecPanel(); return; }
  if(t.closest("#prBack")){ st.edit=null; st.f=null; renderRecPanel(); return; }
  if(!st.f) return;
  const f=st.f;
  const readF=()=>{ f.note=$("prNote").value; f.amount=$("prAmt").value; f.day=+$("prDay").value; f.start=$("prStart").value||f.start; };
  const sg=t.closest("#prSeg button"); if(sg){ readF(); if(f.type!==sg.dataset.t){ f.type=sg.dataset.t; f.cat=(visCats(f.type)[0]||{}).id; } renderRecEdit(); return; }
  const ct=t.closest("#prCats .cat"); if(ct){ f.cat=ct.dataset.c; [...$("prCats").children].forEach(x=>x.classList.toggle("on",x===ct)); return; }
  if(t.closest("#prSave")){
    readF();
    const amount=Math.round((+f.amount||0)*100)/100;
    if(!(amount>0)){ toast("請輸入金額"); return; }
    if(!f.start){ toast("請選擇開始月份"); return; }
    if(st.edit==="new"){
      settings.recurring.push({id:uid("p"),type:f.type,amount,cat:f.cat,day:f.day,note:f.note.trim(),start:f.start,lastRun:null});
    } else {
      const r=settings.recurring.find(x=>x.id===st.edit);
      if(r) Object.assign(r,{type:f.type,amount,cat:f.cat,day:f.day,note:f.note.trim()});
    }
    st.edit=null; st.f=null;
    try{ await store.saveSettings(); }catch(err){ writeErr(err); }
    renderRecPanel(); toast("固定收支已儲存");
    await runRecurring(); renderRecPanel();
    return;
  }
  if(t.closest("#prDel")){
    const b=$("prDel");
    if(!b.dataset.armed){ arm(b,"再按一次確認刪除"); return; }
    settings.recurring=settings.recurring.filter(x=>x.id!==st.edit);
    st.edit=null; st.f=null;
    try{ await store.saveSettings(); }catch(err){ writeErr(err); }
    renderRecPanel(); toast("已刪除"); return;
  }
}
$("openRec").onclick=()=>openPanel("rec");
$("pBody").addEventListener("click",e=>{ if(panelMode==="cats") catAction(e); else if(panelMode==="rec") recAction(e); });
$("pTitle").addEventListener("click",e=>{ if(panelMode==="cats") catAction(e); else if(panelMode==="rec") recAction(e); });

/* ---------- export / backup / restore ---------- */
function download(name,text,type){
  const blob=new Blob([text],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
const stamp=()=>ymd(new Date()).replace(/-/g,"");
$("csvBtn").onclick=async()=>{
  const rows=[["日期","類型","分類","金額","備註"]];
  [...records].sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts).forEach(r=>rows.push([r.date,r.type==="income"?"收入":"支出",catOf(r.cat,r.type).name,r.amount,r.note||""]));
  const csv=rows.map(r=>r.map(v=>{ v=String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(",")).join("\n");
  if(store.mode==="cloud"){
    const box=$("csvBox"); box.value=csv; box.classList.remove("hide");
    try{ await navigator.clipboard.writeText(csv); toast("已複製 "+records.length+" 筆，可直接貼到試算表"); }
    catch(e){ box.focus(); box.select(); toast("請長按文字框手動複製"); }
    return;
  }
  download("ledger-"+stamp()+".csv","﻿"+csv,"text/csv;charset=utf-8");
  toast("已匯出 "+records.length+" 筆");
};
$("bakBtn").onclick=()=>{
  download("ledger-backup-"+stamp()+".json",JSON.stringify({app:"xiaozhangben",v:2,exported:new Date().toISOString(),settings,records}),"application/json");
  toast("備份檔已下載");
};
$("restBtn").onclick=()=>$("restIn").click();
function parseBackup(text){
  text=String(text||"").trim();
  const i=text.indexOf("{"), j=text.indexOf("[");
  const st=(i<0)?j:(j<0?i:Math.min(i,j));
  if(st<0) throw 0;
  return JSON.parse(text.slice(st));
}
async function restoreData(d){
  const list=Array.isArray(d)?d:d.records;
  if(!Array.isArray(list)) throw 0;
  const fresh = !records.length && !settings.cats && !settings.recurring.length && !settings.budget;
  const have=new Set(records.map(r=>r.id)); let n=0;
  const clean=list.filter(r=>r&&r.id&&r.date&&+r.amount>0&&(r.type==="income"||r.type==="expense")).map(r=>({id:String(r.id),type:r.type,amount:+r.amount,cat:String(r.cat||"other"),date:String(r.date),note:String(r.note||""),ts:+r.ts||0,rec:r.rec||null}));
  const bs=d.settings?normSettings(d.settings):null;
  if(bs){
    if(fresh){ settings=bs; }
    else{
      if(bs.cats){
        const L=ensureCats();
        ["expense","income"].forEach(t=>bs.cats[t].forEach(c=>{ if(!L[t].some(x=>x.id===c.id)) L[t].push(c); }));
      }
      bs.recurring.forEach(r=>{ if(!settings.recurring.some(x=>x.id===r.id)) settings.recurring.push(r); });
      if(!settings.budget && bs.budget) settings.budget=bs.budget;
    }
  }
  if(fresh && d.theme && THEMES[d.theme.color]){ theme={mode:d.theme.mode||"auto",color:d.theme.color,style:d.theme.style||theme.style||"pixel"}; lsSet(TK,theme); applyTheme(); }
  if(store.mode==="local"){
    clean.forEach(r=>{ if(!have.has(r.id)) n++; const i=records.findIndex(x=>x.id===r.id); if(i>=0) records[i]=r; else records.push(r); });
    lsSet(LK,records);
  } else {
    for(const r of clean){ if(!have.has(r.id)){ await store.save(r); n++; } }
  }
  await store.saveSettings();
  renderAll();
  return n;
}
$("restIn").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const n=await restoreData(parseBackup(await f.text())); toast("還原完成，新增 "+n+" 筆"); }
  catch(err){ if(err&&err.code) writeErr(err); else toast("這不是有效的備份檔"); }
};
/* 搬家：剪貼簿複製／貼上 */
$("cpBtn").onclick=async()=>{
  const text=JSON.stringify({app:"xiaozhangben",v:2,exported:new Date().toISOString(),settings,theme,records});
  try{ await navigator.clipboard.writeText(text); toast("✅ 已複製 "+records.length+" 筆，到新的 App 按「貼上」"); }
  catch(e){
    const box=$("psBox"), ta=$("psText"); box.classList.remove("hide"); $("psGo").classList.add("hide");
    ta.value=text; ta.focus(); ta.select(); toast("請長按文字框 → 全選 → 拷貝");
  }
};
async function doPaste(text){
  try{ const n=await restoreData(parseBackup(text)); $("psBox").classList.add("hide"); $("psText").value=""; toast("✅ 還原完成，共新增 "+n+" 筆"); }
  catch(err){ if(err&&err.code) writeErr(err); else toast("貼上的內容不是小帳本的資料"); }
}
$("psBtn").onclick=async()=>{
  let text="";
  try{ text=await navigator.clipboard.readText(); }catch(e){ text=""; }
  if(text && /xiaozhangben|"records"/.test(text)){ await doPaste(text); return; }
  const box=$("psBox"); box.classList.remove("hide"); $("psGo").classList.remove("hide"); $("psText").value=""; $("psText").focus();
  toast("請在文字框長按 → 貼上，再按「還原」");
};
$("psGo").onclick=()=>doPaste($("psText").value);
$("importBtn").onclick=async()=>{
  const lr=lsGet(LK,[]); if(!lr.length) return;
  const have=new Set(records.map(r=>r.id));
  $("importBtn").disabled=true;
  try{
    let n=0; for(const r of lr){ if(have.has(r.id)) continue; await store.save(r); n++; }
    lsSet(LK,[]); toast("已匯入 "+n+" 筆"); renderStore();
  }catch(e){ writeErr(e); }
  finally{ $("importBtn").disabled=false; }
};

init();
})();
